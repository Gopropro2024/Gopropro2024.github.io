<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>I love you ❤</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #040103;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 16px;
    text-align: center;
    font: 500 11px/1 "Segoe UI", system-ui, -apple-system, sans-serif;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: rgba(255, 140, 190, .32);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">для Машуни</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const OUT_TEXT = 'I love you';
  const IN_TEXT  = 'i love you';
  const FONT = '"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

  let W = 0, H = 0, DPR = 1;
  let s0 = 1, fsOut = 20, fsIn = 11;
  let outlineItems = [];
  let innerItems = [];
  let bgCanvas = null;

  /* ---------- кривая сердца (локальные координаты, центр в 0,0, y вниз) ---------- */
  function heartPt(t) {
    const s = Math.sin(t);
    const x = 16 * s * s * s;
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x, -y - 6];
  }

  /* ---------- точка внутри полигона ---------- */
  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      if (((yi > py) !== (yj > py)) &&
          (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  /* ---------- расчёт раскладки ---------- */
  function layout() {
    s0 = Math.min(W * 0.80 / 32, H * 0.80 / 22);
    fsOut = Math.max(10, Math.min(30, s0 * 0.72));
    fsIn  = Math.max(6.5, fsOut * 0.52);

    const N = 1400;
    const pts = new Array(N);
    for (let i = 0; i < N; i++) pts[i] = heartPt(i / N * Math.PI * 2);

    // длины дуг
    const cum = new Float64Array(N + 1);
    for (let i = 1; i <= N; i++) {
      const a = pts[i - 1], b = pts[i % N];
      cum[i] = cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    const perim = cum[N];

    /* ===== слова по контуру ===== */
    ctx.save();
    ctx.font = '600 ' + fsOut + 'px ' + FONT;
    const twPx = ctx.measureText(OUT_TEXT).width;
    ctx.restore();

    const twLocal = twPx / s0;
    const gap = twLocal * 0.42;
    const n = Math.max(8, Math.round(perim / (twLocal + gap)));
    const step = perim / n;

    outlineItems = [];
    for (let i = 0; i < n; i++) {
      const L = i * step;

      let lo = 0, hi = N;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] <= L) lo = mid + 1; else hi = mid;
      }
      const idx = Math.min(N, Math.max(1, lo));
      const a = pts[idx - 1], b = pts[idx % N];
      const segLen = (cum[idx] - cum[idx - 1]) || 1e-9;
      const f = (L - cum[idx - 1]) / segLen;

      outlineItems.push({
        x: a[0] + (b[0] - a[0]) * f,
        y: a[1] + (b[1] - a[1]) * f,
        ang: Math.atan2(b[1] - a[1], b[0] - a[0])
      });
    }

    /* ===== слова внутри ===== */
    const INSET = 0.88;
    const poly = new Array(N);
    for (let i = 0; i < N; i++) {
      poly[i] = [pts[i][0] * INSET, pts[i][1] * INSET];
    }

    ctx.save();
    ctx.font = '400 ' + fsIn + 'px ' + FONT;
    const twInPx = ctx.measureText(IN_TEXT).width;
    ctx.restore();

    const stepX = (twInPx / s0) * 1.15;
    const stepY = (fsIn * 2.0) / s0;

    innerItems = [];
    let row = 0;
    for (let y = -11; y <= 11; y += stepY, row++) {
      const off = (row % 2) * stepX * 0.5;
      for (let x = -17 + off; x <= 17; x += stepX) {
        if (pointInPoly(x, y, poly)) innerItems.push({ x, y });
      }
    }
  }

  /* ---------- фон ---------- */
  function makeBackground() {
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.floor(W * DPR));
    c.height = Math.max(1, Math.floor(H * DPR));
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const r = Math.max(W, H) * 0.78;
    const grad = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
    grad.addColorStop(0,    '#2c0a1e');
    grad.addColorStop(0.40, '#170510');
    grad.addColorStop(0.75, '#0a0208');
    grad.addColorStop(1,    '#040103');

    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    bgCanvas = c;
  }

  /* ---------- сердцебиение ---------- */
  function pulseAt(t) {
    const period = 1.25;
    const p = (t % period) / period;
    const b1 = Math.exp(-Math.pow((p - 0.03) / 0.055, 2));
    const b2 = 0.55 * Math.exp(-Math.pow((p - 0.21) / 0.065, 2));
    return 1 + 0.05 * (b1 + b2);
  }

  /* ---------- кадр ---------- */
  function frame(now) {
    const t = now / 1000;
    const pulse = pulseAt(t);
    const s = s0 * pulse;
    const cx = W / 2, cy = H / 2;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

    // мягкое свечение позади сердца
    const gr = s * 25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
    gg.addColorStop(0,    'rgba(255, 70, 130, 0.20)');
    gg.addColorStop(0.45, 'rgba(255, 40, 110, 0.08)');
    gg.addColorStop(1,    'rgba(255, 0, 80, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(cx, cy, gr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- слова по контуру ----
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 ' + fsOut + 'px ' + FONT;
    ctx.shadowColor = 'rgba(255, 45, 110, 0.85)';
    ctx.shadowBlur = fsOut * 0.9;

    for (let i = 0; i < outlineItems.length; i++) {
      const it = outlineItems[i];
      const k = Math.min(1, Math.max(0, (it.y + 11) / 22));

      ctx.save();
      ctx.translate(cx + it.x * s, cy + it.y * s);
      ctx.rotate(it.ang);
      ctx.fillStyle = 'hsl(' + (342 - 14 * k) + ', 100%, ' + (78 - 18 * k) + '%)';
      ctx.fillText(OUT_TEXT, 0, 0);
      ctx.restore();
    }
    ctx.restore();

    // ---- слова внутри ----
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '400 ' + fsIn + 'px ' + FONT;
    ctx.fillStyle = '#ff9ecb';

    for (let i = 0; i < innerItems.length; i++) {
      const it = innerItems[i];
      const d = Math.min(1, Math.hypot(it.x * 0.85, it.y) / 11.5);
      ctx.globalAlpha = 0.10 + 0.40 * (1 - 0.62 * d);
      ctx.fillText(IN_TEXT, cx + it.x * s, cy + it.y * s);
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  /* ---------- размеры ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));

    makeBackground();
    layout();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
